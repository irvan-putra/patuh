name: patuh consistency check
# On demand and weekly. The weekly schedule was approved by Irvan on
# 2026-11-20 (WhatsApp) when he made these checks required across the app
# family; the README said "weekly" from the start but no schedule existed
# until then. A red scheduled run means family drift was found between
# releases - investigate, don't silence.
on:
  schedule:
    # Mondays 02:00 UTC = 09:00 WIB
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      apk:
        description: "also download APKs and verify checksums + packaged icons"
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==12.3.0 pyyaml==6.0.2
      - name: tests (positive and known-bad cases)
        run: python3 tests/test_patuh.py
      - name: source + release + gallery checks
        run: python3 patuh.py --workdir "$RUNNER_TEMP/patuh-clones"
      - name: APK verification
        # always on for the weekly run; on demand it follows the input.
        # always(): one red source finding must not hide the APK results.
        if: ${{ always() && (inputs.apk || github.event_name == 'schedule') }}
        run: python3 patuh.py --apk --workdir "$RUNNER_TEMP/patuh-clones"
