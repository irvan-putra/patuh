name: patuh release gate
# Reusable required check for app repos. Call it from a release workflow,
# pinned to the full reviewed commit SHA of this file (tags are movable and
# must not be used as the pin):
#
#   jobs:
#     consistency:
#       uses: irvan-putra/patuh/.github/workflows/release-gate.yml@<reviewed-full-sha>
#       with:
#         app: myapp
#         published: false   # pre-publish gate on the exact tree being released
#
# published=false (pre-publish gate): checks the CALLER's checkout at the ref
# that triggered the caller's workflow - never patuh's own tree or a default
# branch guess. It verifies package ID, three-number version, lowercase
# label, permission/license drift, family icon geometry and the badge text
# reading the candidate version. Release metadata of older releases is not
# judged here, so fixing an old non-conforming release is never blocked by
# its own past.
#
# candidate_apk_artifact (optional, pre-publish): name of a workflow
# artifact the caller uploaded earlier in the same run, containing exactly
# one APK - the built, not yet published candidate. The gate then also
# checks the actual bytes: the packaged launcher icon must be the family
# badge reading the candidate version, and it logs the candidate's sha256
# for comparison with the sidecar the publish step uploads. This is the
# preventive boundary: wired before the publish job, a defect stops the
# release. The post-publish verify below can only detect a defect that
# already shipped.
#
# published=true (post-publish verify): the new release must be live first;
# runs the full online suite for this app including APK download, sha256
# against the published checksum, the packaged icon's pixels, and the
# gallery card agreeing with the release.
on:
  workflow_call:
    inputs:
      app:
        description: "registry app name in irvan-putra/patuh projects.json"
        required: true
        type: string
      published:
        description: "false = pre-publish source gate; true = the release is already live, verify it"
        type: boolean
        default: false
      candidate_apk_artifact:
        description: "optional artifact name (uploaded earlier this run) holding one candidate APK to byte-check pre-publish"
        type: string
        default: ""
      candidate_version:
        description: "optional candidate version for the byte check when the release flow stamps the version after checkout (e.g. intodo). Default: versionName read from the checked-out source."
        type: string
        default: ""
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Pin the exact reviewed checker commit - a version tag is movable,
        # so a tag here would let the executed patuh.py change under an
        # otherwise immutable caller pin. Advance only by reviewed commits.
        with: { repository: irvan-putra/patuh, ref: 8cdefe3b8581ca4ad2b15faa044f9c1c32838cd9, path: patuh }
      - name: check out the caller's exact candidate tree
        uses: actions/checkout@v4
        with: { path: caller-clone }
      - run: mkdir -p clones && mv caller-clone "clones/${GITHUB_REPOSITORY#*/}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==12.3.0
      - name: pre-publish source gate
        if: ${{ !inputs.published }}
        run: python3 patuh/patuh.py --only "${{ inputs.app }}" --offline --workdir clones
      - name: fetch the candidate APK bytes
        if: ${{ !inputs.published && inputs.candidate_apk_artifact != '' }}
        uses: actions/download-artifact@v4
        with: { name: "${{ inputs.candidate_apk_artifact }}", path: candidate }
      - name: pre-publish candidate APK byte check
        if: ${{ !inputs.published && inputs.candidate_apk_artifact != '' }}
        run: |
          set -euo pipefail
          APK=$(find candidate -name '*.apk' -type f | head -1)
          test -n "$APK" || { echo "no .apk in artifact ${{ inputs.candidate_apk_artifact }}"; exit 1; }
          VER_ARG=()
          if [ -n "${{ inputs.candidate_version }}" ]; then VER_ARG=(--apk-version "${{ inputs.candidate_version }}"); fi
          python3 patuh/patuh.py --only "${{ inputs.app }}" --offline --workdir clones --apk-file "$APK" "${VER_ARG[@]}"
      - name: post-publish verification
        if: inputs.published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 patuh/patuh.py --only "${{ inputs.app }}" --apk --workdir clones
